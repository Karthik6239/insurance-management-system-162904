# Database configuration (development)
# Values are read from environment variables; defaults provided for local dev.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DB:insurance_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate dialect and DDL mode for development
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
