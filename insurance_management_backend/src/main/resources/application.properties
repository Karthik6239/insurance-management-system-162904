# Application metadata
spring.application.name=insurancemanagementbackend

# Default active profile if none specified
spring.profiles.default=dev

# Common JPA settings (can be overridden in profile-specific files)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT/Security Configuration
# Provide a Base64-encoded secret in production via env: SECURITY_JWT_SECRET
# Example generation: openssl rand -base64 32
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.expirationSeconds=${SECURITY_JWT_EXPIRATION_SECONDS:36000}
